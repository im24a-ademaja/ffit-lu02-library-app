openapi: 3.0.3
info:
  title: Project API
  version: 1.0.0
tags:
  - name: Project
    description: Project registration and login
  - name: Account
    description: Project accounts
  - name: Booking
    description: Project bookings
paths:
  /projects:
    post:
      tags:
        - Project
      operationId: createProject
      summary: Register a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Project registered
        '400':
          description: Invalid registration request
        '409':
          description: Project name already exists
  /projects/login:
    post:
      tags:
        - Project
      operationId: loginProject
      summary: Log in to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Project login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginProject200Response'
        '400':
          description: Invalid login request
        '401':
          description: Invalid project name or password
  /accounts:
    get:
      tags:
        - Account
      operationId: getAccounts
      summary: Get accounts for the authenticated project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Missing or invalid authorization
  /bookings:
    get:
      tags:
        - Booking
      operationId: getBookings
      summary: Get bookings for the authenticated project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          description: Missing or invalid authorization
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - projectName
        - password
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          format: password
    LoginProject200Response:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    Account:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
    Booking:
      type: object
      required:
        - id
        - debitAccountId
        - creditAccountId
      properties:
        id:
          type: integer
          format: int32
        debitAccountId:
          type: integer
          format: int32
        creditAccountId:
          type: integer
          format: int32
